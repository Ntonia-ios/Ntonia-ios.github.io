name: Build Ntonia Repo

on:
  push:
    branches:
      - main
    paths:
      - 'debs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gzip xz-utils bzip2

      - name: Build Packages
        run: |
          set -e

          echo "Scanning all .deb files..."

          dpkg-scanpackages -m debs /dev/null > Packages

          gzip -9 -c Packages > Packages.gz
          xz -9 -c Packages > Packages.xz
          bzip2 -9 -c Packages > Packages.bz2

          echo "Packages generated:"
          cat Packages

      - name: Create Release
        run: |
          cat > Release <<EOF
          Origin: Ntonia Repo
          Label: Ntonia Repo
          Suite: stable
          Version: 1.0
          Codename: stable
          Architectures: iphoneos-arm64 iphoneos-arm64e
          Components: main
          Description: Ntonia's Jailbreak Repository
          EOF

      - name: Commit repository files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"

          git add Packages Packages.gz Packages.xz Packages.bz2 Release

          git commit -m "Update Ntonia Repo" || echo "No changes"

          git push