name: Build Ntonia Repo

on:
  push:
    branches:
      - main
    paths:
      - 'debs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dpkg tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Build Packages
        run: |
          mkdir -p dists/stable/main/binary-iphoneos-arm64
          dpkg-scanpackages -m debs /dev/null > dists/stable/main/binary-iphoneos-arm64/Packages
          gzip -9c dists/stable/main/binary-iphoneos-arm64/Packages > dists/stable/main/binary-iphoneos-arm64/Packages.gz
          xz -9 -c dists/stable/main/binary-iphoneos-arm64/Packages > dists/stable/main/binary-iphoneos-arm64/Packages.xz

      - name: Update Release
        run: |
          cat > dists/stable/Release <<EOF
          Origin: Ntonia Repo
          Label: Ntonia Repo
          Suite: stable
          Codename: stable
          Architectures: iphoneos-arm64
          Components: main
          Description: Ntonia's Jailbreak Repository
          EOF

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dists/
          git commit -m "Update repository metadata" || echo "No changes"
          git push
