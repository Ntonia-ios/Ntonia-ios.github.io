name: Build Ntonia Repo

on:
  push:
    branches:
      - main
    paths:
      - 'debs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gzip xz-utils

      - name: Build repository indexes
        run: |
          set -e

          BASE="dists/stable/main"

          mkdir -p "$BASE/binary-iphoneos-arm64"
          mkdir -p "$BASE/binary-iphoneos-arm64e"

          echo "Scanning deb packages..."

          dpkg-scanpackages -m debs /dev/null \
            > "$BASE/binary-iphoneos-arm64/Packages"

          cp "$BASE/binary-iphoneos-arm64/Packages" \
             "$BASE/binary-iphoneos-arm64e/Packages"

          gzip -9 -c "$BASE/binary-iphoneos-arm64/Packages" \
            > "$BASE/binary-iphoneos-arm64/Packages.gz"

          xz -9 -c "$BASE/binary-iphoneos-arm64/Packages" \
            > "$BASE/binary-iphoneos-arm64/Packages.xz"

          gzip -9 -c "$BASE/binary-iphoneos-arm64e/Packages" \
            > "$BASE/binary-iphoneos-arm64e/Packages.gz"

          xz -9 -c "$BASE/binary-iphoneos-arm64e/Packages" \
            > "$BASE/binary-iphoneos-arm64e/Packages.xz"

      - name: Create Release
        run: |
          cat > dists/stable/Release <<EOF
          Origin: Ntonia Repo
          Label: Ntonia Repo
          Suite: stable
          Codename: stable
          Architectures: iphoneos-arm64 iphoneos-arm64e
          Components: main
          Description: Ntonia's Jailbreak Repository
          EOF

      - name: Commit repository metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dists/

          git commit -m "Update repository indexes" || echo "No changes"

          git push