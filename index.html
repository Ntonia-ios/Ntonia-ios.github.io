<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ntonia‑iOS Repo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:#12131a;color:#e6e8f0;min-height:100vh;padding:40px 20px}
.container{max-width:720px;margin:0 auto}
h1{font-size:30px;margin-bottom:8px}
.sub{color:#989cb0;margin-bottom:32px}
.card{background:#1b1d29;border-radius:14px;padding:24px;margin-bottom:22px;border:1px solid #2c2f40}
.repo-url{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
input{flex:1;min-width:220px;padding:12px 14px;border-radius:8px;border:none;background:#0f1017;color:#fff;font-size:15px;outline:1px solid #33364a}
button{padding:12px 18px;border-radius:8px;border:none;background:#4b6cff;color:#fff;font-weight:600;cursor:pointer;transition:.2s}
button:hover{background:#3958e8}
.tip{margin-top:10px;font-size:13px;color:#7f849c;height:18px}
h2{font-size:18px;margin-bottom:14px;color:#d4d8ee}
ol{padding-left:20px;line-height:1.9;color:#c5c9df}
.note{background:#232533;padding:14px;border-radius:10px;margin-top:12px;color:#b0b5cf;font-size:14px;line-height:1.7}
.footer{margin-top:40px;text-align:center;color:#6b708a;font-size:13px}
</style>
</head>
<body>
<div class="container">
    <h1>Ntonia‑iOS 软件源</h1>
    <div class="sub">TrollStore · Dopamine Rootless Tweaks</div>

    <div class="card">
        <h2>源地址</h2>
        <div class="repo-url">
            <input id="urlBox" readonly value="https://ntonia-ios.github.io/">
            <button id="copyBtn">一键复制</button>
        </div>
        <div class="tip" id="msg"></div>
    </div>

    <div class="card">
        <h2>添加源教程</h2>
        <ol>
            <li>打开 Sileo / Zebra / Saily</li>
            <li>点「源」→右上角「+」</li>
            <li>粘贴上面的源地址</li>
            <li>等待刷新完成即可浏览插件</li>
        </ol>
        <div class="note">
            ⚠️ 本源插件主要适配 <b>Rootless（无根/隐根）</b>，iOS 15‑16。
            Rootful 设备安装前请查看插件详情标注。
        </div>
    </div>

    <div class="card">
        <h2>说明</h2>
        <div class="note">
            如有插件闪退、安全模式问题，请前往项目反馈。
        </div>
    </div>

    <div class="footer">© Ntonia‑iOS Repo</div>
</div>

<script>
const box=document.getElementById("urlBox");
const btn=document.getElementById("copyBtn");
const msg=document.getElementById("msg");
btn.onclick=async ()=>{
    try{
        await navigator.clipboard.writeText(box.value);
        msg.innerText="✅ 源地址复制成功，可以直接粘贴到包管理器";
    }catch(e){
        box.select();
        document.execCommand('copy');
        msg.innerText="✅ 已选中，请手动复制";
    }
    setTimeout(()=>msg.innerText="",3000);
};
</script>
</body>
</html>
